<!-- PLAYER BAR COMPONENT -->
<div class="player-bar">
  <div id="player-thumb-container" class="player-thumb">🎵</div>
  <div class="player-info">
    <div id="player-song-title" class="player-song">Rádio Ágape Ao Vivo</div>
    <div id="player-artist-name" class="player-artist">Sintonize com a Graça</div>
  </div>
  <div class="player-controls">
    <button class="player-btn" title="Anterior">◀</button>
    <button class="player-btn play" id="playBtn" title="Play/Pause">▶</button>
    <button class="player-btn" title="Próxima">▶</button>
  </div>
  <div class="player-progress">
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="progress-time"><span id="currentTime">00:00</span><span>--:--</span></div>
  </div>
  <div id="player-volume-container" class="player-vol">
    <span class="vol-icon">🔊</span>
    <input type="range" class="vol-slider" min="0" max="100" value="75">
  </div>
  <div class="player-live">AO VIVO</div>
  
  <audio id="main-audio-player" style="display:none;"></audio>
</div>

<script>
  (function() {
    let isPlaying = false;
    let audioContextReady = false;

    function initPlayerLogic() {
      const audio = document.getElementById('main-audio-player');
      const playBtn = document.getElementById('playBtn');
      const volSlider = document.querySelector('.vol-slider');
      const progressFill = document.getElementById('progressFill');
      const currentTimeStr = document.getElementById('currentTime');

      if (!audio || !playBtn) return;

      // Ensure stream plays as a live stream
      audio.preload = "none";
      
      playBtn.addEventListener('click', () => {
        if (!audio.src) return;

        if (isPlaying) {
          audio.pause();
          isPlaying = false;
          playBtn.textContent = '▶';
          progressFill.style.width = '0%';
          progressFill.style.transition = 'none';
        } else {
          audio.play().then(() => {
            isPlaying = true;
            playBtn.textContent = '⏸';
            // Simple visual effect for live stream
            progressFill.style.width = '100%';
            progressFill.style.transition = 'width 1s ease-in-out';
          }).catch(err => {
            console.error("Audio playback failed:", err);
          });
        }
      });

      if (volSlider) {
        // Set initial volume
        audio.volume = volSlider.value / 100;
        
        volSlider.addEventListener('input', (e) => {
          audio.volume = e.target.value / 100;
        });
      }

      // Simple time counter since streams don't have duration
      let seconds = 0;
      setInterval(() => {
        if (isPlaying) {
          seconds++;
          const m = Math.floor(seconds / 60).toString().padStart(2, '0');
          const s = (seconds % 60).toString().padStart(2, '0');
          if (currentTimeStr) currentTimeStr.textContent = m + ':' + s;
        }
      }, 1000);
    }

    function applyPlayerConfig() {
      const config = ADMIN_DATA.load('player_config');
      if (!config) return;

      const thumb = document.getElementById('player-thumb-container');
      const title = document.getElementById('player-song-title');
      const artist = document.getElementById('player-artist-name');
      const volContainer = document.getElementById('player-volume-container');
      const audio = document.getElementById('main-audio-player');

      if (config.playerTitle && title) title.textContent = config.playerTitle;
      if (config.playerDesc && artist) artist.textContent = config.playerDesc;
      
      if (config.playerImage && thumb) {
        thumb.innerHTML = `<img src="${config.playerImage}" alt="Capa" style="width: 100%; height: 100%; object-fit: cover;">`;
      }

      if (volContainer) {
        volContainer.style.display = config.enableVolume ? 'flex' : 'none';
      }

      if (config.streamUrl && audio) {
        audio.src = config.streamUrl;
      }
    }

    if (window.ADMIN_DATA && typeof ADMIN_DATA.load === 'function') {
      applyPlayerConfig();
      initPlayerLogic();
    }
    window.addEventListener('adminDataReady', () => {
      applyPlayerConfig();
      initPlayerLogic();
    });
  })();
</script>
